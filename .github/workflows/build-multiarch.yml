name: Build Multi-Arch LanCache Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Lowercase Image Prefix
        run: |
          IMAGE_PREFIX="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE_PREFIX=${IMAGE_PREFIX}" >> $GITHUB_ENV

      # Stage 1: Build lancache-ubuntu base image
      - name: Build lancache-ubuntu (amd64 + arm64)
        run: |
          git clone --depth 1 https://github.com/lancachenet/ubuntu.git base-ubuntu
          cd base-ubuntu
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE_PREFIX}/lancache-ubuntu:latest" \
            --push .
          cd ..

      # Stage 2: Build lancache-ubuntu-nginx
      - name: Build lancache-ubuntu-nginx (amd64 + arm64)
        run: |
          git clone --depth 1 https://github.com/lancachenet/ubuntu-nginx.git base-nginx
          cd base-nginx
          # Point base image to our newly published multi-arch lancache-ubuntu
          sed -i "s|lancachenet/ubuntu:latest|${IMAGE_PREFIX}/lancache-ubuntu:latest|g" Dockerfile
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE_PREFIX}/lancache-ubuntu-nginx:latest" \
            --push .
          cd ..

      # Stage 3: Build lancache-monolithic
      - name: Build lancache-monolithic (amd64 + arm64)
        run: |
          git clone --depth 1 https://github.com/lancachenet/monolithic.git monolithic
          cd monolithic
          # Point base image to our multi-arch lancache-ubuntu-nginx
          sed -i "s|lancachenet/ubuntu-nginx:latest|${IMAGE_PREFIX}/lancache-ubuntu-nginx:latest|g" Dockerfile
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE_PREFIX}/lancache-monolithic:latest" \
            -t "${IMAGE_PREFIX}/lancache-monolithic:0.2.1" \
            --push .
          cd ..

      # Stage 4: Build lancache-dns
      - name: Build lancache-dns (amd64 + arm64)
        run: |
          git clone --depth 1 https://github.com/lancachenet/lancache-dns.git dns
          cd dns
          # Point base image to our multi-arch lancache-ubuntu
          sed -i "s|lancachenet/ubuntu:latest|${IMAGE_PREFIX}/lancache-ubuntu:latest|g" Dockerfile
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "${IMAGE_PREFIX}/lancache-dns:latest" \
            -t "${IMAGE_PREFIX}/lancache-dns:0.2.1" \
            --push .
          cd ..

      - name: Output Published Digests
        run: |
          echo "=== Multi-Arch Images Published ==="
          echo "Monolithic: ${IMAGE_PREFIX}/lancache-monolithic:0.2.1"
          docker buildx imagetools inspect "${IMAGE_PREFIX}/lancache-monolithic:0.2.1"
          echo "DNS: ${IMAGE_PREFIX}/lancache-dns:0.2.1"
          docker buildx imagetools inspect "${IMAGE_PREFIX}/lancache-dns:0.2.1"
